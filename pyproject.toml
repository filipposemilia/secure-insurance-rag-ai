[project]
name = "secure-insurance-rag"
version = "0.1.0"
description = "PoC di RAG sicuro su documentazione assicurativa: PII masking, guardrails anti prompt-injection, RBAC sui vettori."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.4",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.3.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
ollama = ["langchain-ollama>=0.2.0"]
presidio = ["presidio-analyzer>=2.2.0", "presidio-anonymizer>=2.2.0"]

[project.scripts]
secure-rag = "secure_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
